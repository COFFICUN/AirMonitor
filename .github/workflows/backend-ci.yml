name: Backend CI

on:
  pull_request:
    paths:
      - backend/**
      - docs/**
      - compose.yaml
      - .env.example
      - .gitattributes
      - .gitignore
      - README.md
      - .github/workflows/backend-ci.yml
  push:
    branches:
      - develop
    paths:
      - backend/**
      - docs/**
      - compose.yaml
      - .env.example
      - .gitattributes
      - .gitignore
      - README.md
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  offline:
    name: Offline backend tests
    runs-on: ubuntu-latest
    env:
      AIRMONITOR_DATABASE_URL: ""
      AIRMONITOR_RUN_PERSISTENCE_INTEGRATION: ""
      AIRMONITOR_TEST_DATABASE_URL: ""
      AIRMONITOR_API_TEST_DATABASE_URL: ""
      AIRMONITOR_READ_API_TEST_DATABASE_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Check dependency consistency
        run: python -B -m pip check

      - name: Verify the sole Alembic head
        working-directory: backend
        run: >-
          python -B -c "from alembic.config import Config;
          from alembic.script import ScriptDirectory;
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads();
          assert heads == ['a75caa2b44f5'], heads"

      - name: Run complete offline backend suite
        working-directory: backend
        run: python -B -m pytest -p no:cacheprovider

  postgresql:
    name: Guarded PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: airmonitor_api_test_ci
      POSTGRES_USER: airmonitor_ci
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_DB: airmonitor_api_test_ci
          POSTGRES_USER: airmonitor_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airmonitor_ci -d airmonitor_api_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Apply Alembic migrations
        working-directory: backend
        env:
          AIRMONITOR_ENVIRONMENT: test
          AIRMONITOR_DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ env.POSTGRES_DB }}
        run: python -B -m alembic upgrade head

      - name: Verify guarded preflight and reset contracts
        working-directory: backend
        env:
          AIRMONITOR_DATABASE_URL: ""
          AIRMONITOR_RUN_PERSISTENCE_INTEGRATION: ""
          AIRMONITOR_TEST_DATABASE_URL: ""
          AIRMONITOR_API_TEST_DATABASE_URL: ""
          AIRMONITOR_READ_API_TEST_DATABASE_URL: ""
        run: >-
          python -B -m pytest -p no:cacheprovider
          tests/test_api_integration_guard.py
          tests/test_persistence_guard.py
          tests/test_integration_database_reset.py

      - name: Run API PostgreSQL integration suite
        working-directory: backend
        env:
          AIRMONITOR_API_TEST_DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ env.POSTGRES_DB }}
        run: python -B -m pytest -p no:cacheprovider tests/test_api_integration.py

      - name: Run persistence PostgreSQL integration suite
        working-directory: backend
        env:
          AIRMONITOR_RUN_PERSISTENCE_INTEGRATION: "1"
          AIRMONITOR_TEST_DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ env.POSTGRES_DB }}
        run: python -B -m pytest -p no:cacheprovider tests/test_persistence_integration.py

  docker:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag airmonitor-api:ci backend

      - name: Verify configured runtime user
        run: |
          runtime_user="$(docker image inspect --format '{{.Config.User}}' airmonitor-api:ci)"
          test -n "${runtime_user}"
          test "${runtime_user}" != "root"
          test "${runtime_user%%:*}" != "0"
